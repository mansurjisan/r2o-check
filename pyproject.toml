[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "r2o-check"
version = "0.1.0"
description = "NCO Implementation Standards v11.0 compliance checker for NOAA operational model code"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "r2o-check contributors" },
]
keywords = ["NOAA", "NCO", "linting", "compliance", "operational-models"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "click>=8.0",
    "rich>=12.0",
    "pyyaml>=6.0",
]

[project.scripts]
r2o-check = "r2o_check.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.0",
    "types-PyYAML",
]

[tool.hatch.build.targets.wheel]
packages = ["src/r2o_check"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=r2o_check --cov-report=term-missing"

[tool.ruff]
target-version = "py39"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["r2o_check"]
